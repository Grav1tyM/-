<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock 比赛筛选</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Deadlock 比赛筛选</h1>
        <p class="lede">
          输入 Steam 好友码，查找 Statlocker 上的玩家，并列出爆头率和命中率都高于阈值的比赛。
        </p>
      </header>

      <form id="lookup-form" class="panel lookup">
        <label class="field">
          好友码
          <input
            id="friend-code"
            name="friend-code"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            placeholder="例如 9560260"
            required
          />
          <span class="hint">Steam 好友码就是账户 ID。也可以粘贴 Steam64 或数字个人资料链接。</span>
        </label>
        <button id="lookup-button" type="submit">查找玩家</button>
      </form>

      <section id="player" class="player" hidden></section>

      <form id="filter-form" class="panel" hidden>
        <div class="thresholds">
          <label class="field">
            爆头率高于（%）
            <input id="headshot-threshold" type="number" min="0" max="100" step="0.1" value="20" />
          </label>
          <label class="field">
            命中率高于（%）
            <input id="accuracy-threshold" type="number" min="0" max="100" step="0.1" value="50" />
          </label>
        </div>
        <fieldset class="priority-picker">
          <legend>优先指标</legend>
          <label class="choice">
            <input type="radio" name="priority" value="headshot" checked />
            <span>爆头率优先</span>
          </label>
          <label class="choice">
            <input type="radio" name="priority" value="accuracy" />
            <span>命中率优先</span>
          </label>
        </fieldset>
        <p class="rule">
          一场比赛必须同时高于两个阈值才会出现（等于不算）。优先指标决定排序：更高的排在前面；数值相同时再比另一项，仍相同则新的比赛在前。
        </p>
        <button id="filter-button" type="submit">筛选比赛</button>
      </form>

      <p id="status" class="status" role="status"></p>
      <p id="error" class="error" role="alert" hidden></p>

      <section id="results" class="results" hidden>
        <div id="summary"></div>
        <div class="table-wrap">
          <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>

      <p class="foot">
        查询从这台电脑直接发往 statlocker.gg，不需要另外启动服务器。点击比赛代码会用系统浏览器打开对应的 Statlocker 比赛页。
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
