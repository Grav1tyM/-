[package]
name = "deadlock-core"
version = "0.1.0"
edition = "2021"
description = "Statlocker lookup and match parsing for the desktop filter"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
